name: Repository Compliance

on:
  workflow_call:
  workflow_dispatch:

jobs:
  verify:
    name: Verify Architectural Governance
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v411bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Run Compliance Auditor
        shell: pwsh
        run: pwsh -File scripts/verify-compliance.ps1
